<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Doctor Deck · Propuestas de logo</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url(../../assets/fonts/InstrumentSans-Bold.ttf);
        font-weight: 700;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url(../../assets/fonts/InstrumentSans-Regular.ttf);
        font-weight: 400;
      }
      body {
        margin: 0;
        background: #0e0e0e;
        color: #e8e6e3;
        font-family: "Instrument Sans", system-ui, sans-serif;
        padding: 32px;
        width: 1240px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 24px;
      }
      .row {
        display: grid;
        grid-template-columns: 190px 250px 250px 1fr;
        gap: 20px;
        align-items: center;
        background: #1a1a1a;
        border: 1px solid #2c2c2c;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .t b {
        display: block;
        font-size: 19px;
        margin-bottom: 6px;
      }
      .t span {
        font-size: 13px;
        color: #aba7a1;
        line-height: 1.4;
      }
      .dark,
      .light {
        border-radius: 10px;
        padding: 14px;
        display: flex;
        justify-content: center;
      }
      .dark {
        background: #131313;
      }
      .light {
        background: #f4f3f1;
      }
      .icons {
        display: flex;
        gap: 18px;
        align-items: flex-end;
      }
      .icons figure {
        margin: 0;
        text-align: center;
        font-size: 11px;
        color: #8a8680;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #2a2a2a;
        border-radius: 8px 8px 0 0;
        padding: 7px 12px;
        font-size: 12px;
        width: 120px;
      }
      .tab.l {
        background: #e9e7e4;
        color: #1c1b19;
      }
    </style>
  </head>
  <body>
    <h1>Doctor Deck — 5 propuestas de logo y favicon</h1>
    <div id="list"></div>
    <script src="logos.js"></script>
    <script>
      const logos = window.LOGOS;
      document.getElementById("list").innerHTML = logos
        .map(
          (l) => `
<div class="row">
  <div class="t"><b>${l.name}</b><span>${l.idea}</span></div>
  <div class="dark"><img src="${l.slug}/logo-dark.svg" width="222"></div>
  <div class="light"><img src="${l.slug}/logo-light.svg" width="222"></div>
  <div class="icons">
    <figure><img src="${l.slug}/mark.svg" width="96"><figcaption>app</figcaption></figure>
    <figure><img src="${l.slug}/favicon.svg" width="48"><figcaption>48</figcaption></figure>
    <figure><img src="${l.slug}/favicon.svg" width="32"><figcaption>32</figcaption></figure>
    <figure><img src="${l.slug}/favicon.svg" width="16"><figcaption>16</figcaption></figure>
    <div><div class="tab"><img src="${l.slug}/favicon.svg" width="16">Doctor Deck</div><div class="tab l" style="margin-top:6px"><img src="${l.slug}/favicon.svg" width="16">Doctor Deck</div></div>
  </div>
</div>`,
        )
        .join("");
    </script>
  </body>
</html>
