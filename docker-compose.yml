# Producción en el VPS: la app detrás del Traefik que ya corre allí (red externa `pulsestack_proxy`,
# certificados de Let's Encrypt con el resolver `le`). Variables en .env (ver DEPLOY.md):
#   DECK_DOCTOR_HOST   dominio público, p. ej. deckdoctor.37.27.32.222.nip.io
#   APP_PASSWORD       contraseña de la pantalla /login (la app no se expone sin ella)
services:
  deck-doctor:
    build: .
    container_name: deck_doctor
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deckdoctor.rule=Host(`${DECK_DOCTOR_HOST:?DECK_DOCTOR_HOST must be set}`)"
      - "traefik.http.routers.deckdoctor.entrypoints=websecure"
      - "traefik.http.routers.deckdoctor.tls.certresolver=le"
      - "traefik.http.services.deckdoctor.loadbalancer.server.port=3010"

networks:
  proxy:
    name: pulsestack_proxy
    external: true
