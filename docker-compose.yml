# Producción en el VPS: la app detrás del Traefik que ya corre allí (red externa `pulsestack_proxy`,
# certificados de Let's Encrypt con el resolver `le`). Variables en .env (ver DEPLOY.md):
#   DECK_DOCTOR_HOST     dominio público, p. ej. doctordeck.app
#   DECK_DOCTOR_OLD_HOST dominio anterior, que redirige al público (por defecto la dirección nip.io
#                        con la que empezó la app); `www.` del público también redirige
#   BETTER_AUTH_SECRET   secreto de las sesiones de usuario (scripts/deploy.sh lo genera si falta)
services:
  deck-doctor:
    build: .
    container_name: deck_doctor
    restart: unless-stopped
    env_file: .env
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: https://${DECK_DOCTOR_HOST:?DECK_DOCTOR_HOST must be set}
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deckdoctor.rule=Host(`${DECK_DOCTOR_HOST:?DECK_DOCTOR_HOST must be set}`)"
      - "traefik.http.routers.deckdoctor.entrypoints=websecure"
      - "traefik.http.routers.deckdoctor.tls.certresolver=le"
      # Gana siempre al de redirección (si el dominio antiguo y el público coinciden, no hay bucle).
      - "traefik.http.routers.deckdoctor.priority=100"
      - "traefik.http.routers.deckdoctor.service=deckdoctor"
      - "traefik.http.services.deckdoctor.loadbalancer.server.port=3010"
      # www. y el dominio antiguo → el público, con la misma ruta (301): los enlaces ya compartidos
      # siguen funcionando.
      - "traefik.http.routers.deckdoctor-redirect.rule=Host(`www.${DECK_DOCTOR_HOST}`) || Host(`${DECK_DOCTOR_OLD_HOST:-deckdoctor.37.27.32.222.nip.io}`)"
      - "traefik.http.routers.deckdoctor-redirect.entrypoints=websecure"
      - "traefik.http.routers.deckdoctor-redirect.tls.certresolver=le"
      - "traefik.http.routers.deckdoctor-redirect.priority=1"
      - "traefik.http.routers.deckdoctor-redirect.service=deckdoctor"
      - "traefik.http.routers.deckdoctor-redirect.middlewares=deckdoctor-to-main"
      - "traefik.http.middlewares.deckdoctor-to-main.redirectregex.regex=^https?://[^/]+(.*)$$"
      - "traefik.http.middlewares.deckdoctor-to-main.redirectregex.replacement=https://${DECK_DOCTOR_HOST}$${1}"
      - "traefik.http.middlewares.deckdoctor-to-main.redirectregex.permanent=true"

networks:
  proxy:
    name: pulsestack_proxy
    external: true
