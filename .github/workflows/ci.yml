name: CI / Deploy

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  deploy:
    name: Desplegar en el VPS
    needs: checks
    # Solo en push a main (no en PRs ni en otras ramas)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Avisar si falta configurar el VPS
        if: env.VPS_HOST == ''
        run: echo "::warning::No hay secreto VPS_HOST; se omite el despliegue. Ver DEPLOY.md."
      - name: Pull y redespliegue por SSH
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            bash scripts/deploy.sh
